name: Build signed APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELTUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Secret PIXELTUNE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        env:
          PIXELTUNE_KEYSTORE_PATH: release.keystore
          PIXELTUNE_STORE_PASSWORD: ${{ secrets.PIXELTUNE_STORE_PASSWORD }}
          PIXELTUNE_KEY_ALIAS: ${{ secrets.PIXELTUNE_KEY_ALIAS || 'pixeltune' }}
          PIXELTUNE_KEY_PASSWORD: ${{ secrets.PIXELTUNE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'PixelTune-debug-apk' || 'PixelTune-signed-release-apk' }}
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
